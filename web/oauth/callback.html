<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>카카오 로그인 처리 중...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #FEE500;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>로그인 처리 중...</h2>
    <p>잠시만 기다려주세요.</p>
  </div>

  <script>
    console.log('🔍 [Kakao OAuth Callback] Page loaded');

    // URL에서 인가 코드 또는 에러 추출
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');

    console.log('🔍 [Callback] Code:', code ? code.substring(0, 20) + '...' : 'null');
    console.log('🔍 [Callback] Error:', error);

    if (code) {
      // localStorage에 인가 코드 저장
      try {
        localStorage.setItem('kakao_auth_code', code);
        console.log('✅ [Callback] Code saved to localStorage');
      } catch (e) {
        console.error('❌ [Callback] Failed to save code:', e);
      }

      // Flutter 앱의 auth 페이지로 리다이렉트
      console.log('🔄 [Callback] Redirecting to auth page...');
      setTimeout(function() {
        window.location.replace('/#/auth?kakao_login=true');
      }, 500);

    } else if (error) {
      // 에러 저장
      try {
        localStorage.setItem('kakao_auth_error', error);
        console.error('❌ [Callback] Error saved to localStorage:', error);
      } catch (e) {
        console.error('❌ [Callback] Failed to save error:', e);
      }

      // 에러 메시지 표시 후 리다이렉트
      document.querySelector('.container').innerHTML =
        '<h2>로그인 실패</h2>' +
        '<p>오류: ' + error + '</p>' +
        '<p>잠시 후 로그인 페이지로 이동합니다...</p>';

      setTimeout(function() {
        window.location.replace('/#/auth');
      }, 2000);

    } else {
      // 코드도 에러도 없는 경우
      console.error('❌ [Callback] No code or error in URL');
      document.querySelector('.container').innerHTML =
        '<h2>인증 정보 없음</h2>' +
        '<p>카카오 로그인 중 문제가 발생했습니다.</p>' +
        '<p>잠시 후 로그인 페이지로 이동합니다...</p>';

      setTimeout(function() {
        window.location.replace('/#/auth');
      }, 2000);
    }
  </script>
</body>
</html>
