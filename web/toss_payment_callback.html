<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 처리 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 20px;
      border: 4px solid #E5E7EB;
      border-top: 4px solid #0064FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { font-size: 24px; color: #111827; margin-bottom: 12px; }
    p { color: #6B7280; font-size: 14px; }
    .error { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; padding: 16px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1 id="title">결제 승인 처리 중...</h1>
    <p id="message">잠시만 기다려주세요.</p>
    <div id="error" class="error" style="display: none;"></div>
  </div>

  <script>
    console.log('=== 토스페이먼츠 v2 결제 콜백 페이지 로드됨 ===');
    
    // 로드 완료 알림 전송
    notifyParent({ type: 'TOSS_PAYMENT_CALLBACK_LOADED' });

    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    
    console.log('🔖 Callback Type:', type);

    // 타입에 따른 처리
    if (type === 'success') {
      handleSuccess();
    } else if (type === 'fail') {
      handleFail();
    } else {
      console.error('❌ 잘못된 Callback Type:', type);
      showError('잘못된 접근입니다.');
    }

    /**
     * 결제 성공 처리 (v2 패턴)
     * 1. 서버에 결제 승인 요청 (Firestore에 저장됨)
     * 2. Flutter 앱에 메시지 전송 (백업)
     * 3. Flutter는 Firestore 실시간 리스닝으로 결과 감지
     */
    async function handleSuccess() {
      const paymentKey = urlParams.get('paymentKey');
      const orderId = urlParams.get('orderId');
      const amount = urlParams.get('amount');

      console.log('📦 결제 데이터:', { paymentKey, orderId, amount });

      // 파라미터 검증
      if (!paymentKey || !orderId || !amount) {
        console.error('❌ 필수 파라미터 누락:', { paymentKey, orderId, amount });
        showError('결제 정보가 올바르지 않습니다.');
        return;
      }

      try {
        // 서버에 결제 승인 요청 (Firestore에 저장됨)
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const apiUrl = isLocal
          ? 'https://asia-northeast3-picom-team.cloudfunctions.net/api/toss-payment/confirm'
          : '/api/toss-payment/confirm';

        console.log('🌐 서버 승인 요청:', apiUrl);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentKey,
            orderId,
            amount: parseInt(amount)
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || `승인 실패 (${response.status})`);
        }

        const result = await response.json();
        console.log('✅ 서버 승인 완료:', result);

        // Flutter 앱에 성공 메시지 전송 (백업용)
        notifyParent({
          type: 'TOSS_PAYMENT_SUCCESS',
          paymentKey,
          orderId,
          amount: parseInt(amount),
          payment: result
        });

        // UI 업데이트
        showSuccess('결제가 완료되었습니다!', '잠시 후 자동으로 돌아갑니다.');

        // 3초 후 앱으로 리다이렉트 시도 (모바일 웹뷰 환경 대응)
        setTimeout(() => {
          // 앱 딥링크로 리다이렉트 시도
          window.location.href = `picom://toss-payment/success?paymentKey=${paymentKey}&orderId=${orderId}&amount=${amount}`;
        }, 2000);

      } catch (error) {
        console.error('❌ 결제 승인 에러:', error);
        showError('결제 승인 실패: ' + (error.message || '알 수 없는 오류'));

        notifyParent({
          type: 'TOSS_PAYMENT_FAIL',
          code: 'CONFIRM_ERROR',
          message: error.message || '결제 승인 중 오류가 발생했습니다.'
        });
      }
    }

    /**
     * 결제 실패 처리 (v2 패턴)
     */
    function handleFail() {
      const code = urlParams.get('code');
      const message = urlParams.get('message');
      const orderId = urlParams.get('orderId');

      console.log('❌ 결제 실패:', { code, message, orderId });

      // Flutter 앱에 실패 메시지 전송
      notifyParent({
        type: 'TOSS_PAYMENT_FAIL',
        code: code || 'PAYMENT_FAILED',
        message: decodeURIComponent(message || '결제에 실패했습니다.'),
        orderId
      });

      showError(decodeURIComponent(message || '결제에 실패했습니다.'));
    }

    /**
     * 부모 창(Flutter)에 메시지 전송
     */
    function notifyParent(data) {
      if (window.parent && window.parent !== window) {
        console.log('📤 Flutter 앱에 메시지 전송:', data.type);
        window.parent.postMessage(JSON.stringify(data), '*');
      }
    }

    /**
     * 성공 UI 표시
     */
    function showSuccess(title, message) {
      document.getElementById('title').textContent = title;
      document.getElementById('message').textContent = message;
      document.querySelector('.spinner').style.display = 'none';
    }

    /**
     * 에러 UI 표시
     */
    function showError(message) {
      document.getElementById('title').textContent = '오류 발생';
      document.getElementById('message').textContent = '';
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
    }
  </script>
</body>
</html>
