<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토스페이먼츠 결제</title>
  <!-- 토스페이먼츠 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    #payment-method {
      margin-bottom: 16px;
    }
    #agreement {
      margin-bottom: 24px;
    }
    .pay-button {
      width: 100%;
      padding: 16px;
      background: #0064FF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pay-button:hover { background: #0052D9; }
    .pay-button:disabled {
      background: #D1D5DB;
      cursor: not-allowed;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E5E7EB;
      border-top: 3px solid #0064FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      color: #6B7280;
      font-size: 14px;
    }
    .error-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 16px;
      color: #DC2626;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .amount-info {
      background: #F3F4F6;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: none;
    }
    .amount-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: #4B5563;
    }
    .amount-row:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px solid #D1D5DB;
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 로딩 상태 -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p class="loading-text">결제 수단을 불러오는 중...</p>
    </div>

    <!-- 에러 표시 -->
    <div id="error-container" style="display: none;"></div>

    <!-- 결제 금액 정보 -->
    <div id="amount-info" class="amount-info">
      <div class="amount-row">
        <span>상품 금액</span>
        <span id="product-amount">0원</span>
      </div>
      <div class="amount-row">
        <span>배송비</span>
        <span id="shipping-fee">0원</span>
      </div>
      <div class="amount-row">
        <span>총 결제 금액</span>
        <span id="total-amount">0원</span>
      </div>
    </div>

    <!-- 결제 수단 UI -->
    <div id="payment-method" style="display: none;"></div>

    <!-- 이용약관 UI -->
    <div id="agreement" style="display: none;"></div>

    <!-- 결제 버튼 -->
    <button id="payment-button" class="pay-button" style="display: none;" disabled>
      결제하기
    </button>
  </div>

  <script>
    // URL 파라미터에서 결제 정보 추출
    const urlParams = new URLSearchParams(window.location.search);

    // 클라이언트 키 (테스트 키)
    const clientKey = urlParams.get('clientKey') || 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
    // 고객 식별 키
    const customerKey = urlParams.get('customerKey') || generateRandomString();

    // 결제 정보
    const orderId = urlParams.get('orderId') || '';
    const orderName = urlParams.get('orderName') || '';
    const productAmount = parseInt(urlParams.get('productAmount')) || 0;
    const shippingFee = parseInt(urlParams.get('shippingFee')) || 0;
    const totalAmount = parseInt(urlParams.get('amount')) || (productAmount + shippingFee);
    const customerName = urlParams.get('customerName') || '';
    const customerEmail = urlParams.get('customerEmail') || '';
    const customerPhone = urlParams.get('customerPhone') || '';

    // 콜백 URL (같은 origin 사용)
    const baseUrl = window.location.origin;
    const successUrl = `${baseUrl}/toss_payment_callback.html?type=success`;
    const failUrl = `${baseUrl}/toss_payment_callback.html?type=fail`;

    // 결제 금액 객체
    const amount = {
      currency: "KRW",
      value: totalAmount,
    };

    console.log('=== 토스페이먼츠 v2 결제 초기화 ===');
    console.log('clientKey:', clientKey);
    console.log('customerKey:', customerKey);
    console.log('orderId:', orderId);
    console.log('orderName:', orderName);
    console.log('amount:', amount);
    console.log('successUrl:', successUrl);
    console.log('failUrl:', failUrl);

    // 금액 포맷팅
    function formatPrice(price) {
      return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // 랜덤 문자열 생성 (공식 샘플 방식)
    function generateRandomString() {
      return window.btoa(Math.random()).slice(0, 20);
    }

    // 에러 표시
    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errorContainer = document.getElementById('error-container');
      errorContainer.innerHTML = `<div class="error-box">${message}</div>`;
      errorContainer.style.display = 'block';

      // 부모 창에 에러 전달
      window.parent.postMessage({
        type: 'TOSS_PAYMENT_FAIL',
        code: 'INIT_ERROR',
        message: message
      }, '*');
    }

    // 메인 함수 (공식 샘플 구조)
    async function main() {
      // 파라미터 검증
      if (!orderId || !totalAmount) {
        showError('필수 결제 정보가 누락되었습니다.');
        return;
      }

      const button = document.getElementById('payment-button');

      try {
        console.log('TossPayments SDK 초기화...');

        // 1. SDK 초기화
        const tossPayments = TossPayments(clientKey);

        // 2. 결제 위젯 인스턴스 생성
        const widgets = tossPayments.widgets({
          customerKey: customerKey,
        });

        // 3. 결제 금액 설정
        console.log('금액 설정:', amount);
        await widgets.setAmount(amount);

        // 4. 결제 UI 렌더링 (동시 실행)
        console.log('결제 UI 렌더링...');
        await Promise.all([
          widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT",
          }),
          widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "AGREEMENT",
          }),
        ]);

        // 5. 로딩 숨기고 UI 표시
        document.getElementById('loading').style.display = 'none';

        // 금액 정보 표시
        if (productAmount > 0) {
          document.getElementById('product-amount').textContent = formatPrice(productAmount) + '원';
          document.getElementById('shipping-fee').textContent = shippingFee > 0 ? formatPrice(shippingFee) + '원' : '무료';
          document.getElementById('total-amount').textContent = formatPrice(totalAmount) + '원';
          document.getElementById('amount-info').style.display = 'block';
        }

        document.getElementById('payment-method').style.display = 'block';
        document.getElementById('agreement').style.display = 'block';

        button.textContent = formatPrice(totalAmount) + '원 결제하기';
        button.style.display = 'block';
        button.disabled = false;

        console.log('결제 위젯 초기화 완료!');

        // 6. 결제 버튼 클릭 이벤트
        button.addEventListener('click', async function() {
          button.disabled = true;
          button.textContent = '결제 처리 중...';

          console.log('=== 결제 요청 시작 ===');

          try {
            // 결제 요청 파라미터 (공식 샘플 구조)
            const paymentParams = {
              orderId: orderId,
              orderName: orderName,
              successUrl: successUrl,
              failUrl: failUrl,
            };

            // 선택적 파라미터 추가
            if (customerName && customerName.trim()) {
              paymentParams.customerName = customerName;
            }
            if (customerEmail && customerEmail.trim()) {
              paymentParams.customerEmail = customerEmail;
            }
            if (customerPhone && customerPhone.length >= 10) {
              paymentParams.customerMobilePhone = customerPhone;
            }

            console.log('Payment params:', JSON.stringify(paymentParams, null, 2));

            // 결제 요청 (성공 시 successUrl로 리다이렉트)
            await widgets.requestPayment(paymentParams);

            // 이 코드는 실행되지 않음 (리다이렉트됨)
            console.log('requestPayment 완료');

          } catch (error) {
            console.error('결제 요청 에러:', error);

            const errorCode = error?.code || 'UNKNOWN_ERROR';
            const errorMessage = error?.message || '결제 처리 중 오류가 발생했습니다.';

            // 사용자 취소
            if (errorCode === 'USER_CANCEL' || errorCode === 'PAY_PROCESS_CANCELED') {
              window.parent.postMessage({ type: 'TOSS_PAYMENT_CANCEL' }, '*');
            } else {
              window.parent.postMessage({
                type: 'TOSS_PAYMENT_FAIL',
                code: errorCode,
                message: errorMessage
              }, '*');
            }

            button.disabled = false;
            button.textContent = formatPrice(totalAmount) + '원 결제하기';
          }
        });

      } catch (error) {
        console.error('초기화 에러:', error);
        showError('결제 수단을 불러오는 중 오류가 발생했습니다: ' + (error.message || '알 수 없는 오류'));
      }
    }

    // 실행
    main();
  </script>
</body>
</html>
