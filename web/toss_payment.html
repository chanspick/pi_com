<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토스페이먼츠 결제</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    #payment-method, #agreement {
      margin-bottom: 16px;
    }
    .pay-button {
      width: 100%;
      padding: 16px;
      background: #0064FF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    .pay-button:hover { background: #0052CC; }
    .pay-button:disabled { background: #CCCCCC; cursor: not-allowed; }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #EEEEEE;
      border-top: 3px solid #0064FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error-message {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 16px;
      color: #DC2626;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 16px; color: #666; font-size: 14px;">결제 수단을 불러오는 중...</p>
    </div>

    <div id="error-container" style="display: none;"></div>
    <div id="payment-method" style="display: none;"></div>
    <div id="agreement" style="display: none;"></div>

    <button id="pay-button" class="pay-button" style="display: none;">
      결제하기
    </button>
  </div>

  <script>
    // URL 파라미터 파싱
    const urlParams = new URLSearchParams(window.location.search);
    const clientKey = urlParams.get('clientKey') || 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
    const customerKey = urlParams.get('customerKey') || '';
    const orderId = urlParams.get('orderId') || '';
    const orderName = urlParams.get('orderName') || '';
    const amount = parseInt(urlParams.get('amount')) || 0;
    const customerName = urlParams.get('customerName') || '';
    const customerEmail = urlParams.get('customerEmail') || '';
    const customerPhone = urlParams.get('customerPhone') || '';

    // 콜백 URL (같은 origin 사용)
    const baseUrl = window.location.origin;
    const successUrl = `${baseUrl}/toss_payment_callback.html?type=success`;
    const failUrl = `${baseUrl}/toss_payment_callback.html?type=fail`;

    let widgets = null;

    console.log('=== 결제 정보 ===');
    console.log('orderId:', orderId);
    console.log('orderName:', orderName);
    console.log('amount:', amount);
    console.log('successUrl:', successUrl);
    console.log('failUrl:', failUrl);

    // 금액 포맷팅
    function formatPrice(price) {
      return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    async function initializePayment() {
      try {
        console.log('TossPayments 초기화 중...');
        const tossPayments = TossPayments(clientKey);
        widgets = tossPayments.widgets({ customerKey: customerKey });

        console.log('금액 설정:', amount);
        await widgets.setAmount({
          currency: "KRW",
          value: amount
        });

        console.log('결제 수단 렌더링...');
        await widgets.renderPaymentMethods({
          selector: "#payment-method",
          variantKey: "DEFAULT"
        });
        await widgets.renderAgreement({
          selector: "#agreement",
          variantKey: "AGREEMENT"
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('payment-method').style.display = 'block';
        document.getElementById('agreement').style.display = 'block';

        const payButton = document.getElementById('pay-button');
        payButton.textContent = formatPrice(amount) + '원 결제하기';
        payButton.style.display = 'block';
        payButton.onclick = requestPayment;

        console.log('결제 위젯 초기화 완료!');
      } catch (error) {
        console.error('초기화 오류:', error);
        showError('결제 수단을 불러오는 중 오류가 발생했습니다: ' + (error.message || '알 수 없는 오류'));
      }
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-container').innerHTML = '<div class="error-message">' + message + '</div>';
      document.getElementById('error-container').style.display = 'block';
    }

    async function requestPayment() {
      const button = document.getElementById('pay-button');
      button.disabled = true;
      button.textContent = '결제 처리 중...';

      console.log('=== requestPayment 시작 ===');

      if (!widgets) {
        console.error('widgets 객체가 없습니다!');
        window.parent.postMessage({
          type: 'TOSS_PAYMENT_FAIL',
          code: 'WIDGETS_NOT_INITIALIZED',
          message: '결제 위젯이 초기화되지 않았습니다.'
        }, '*');
        return;
      }

      try {
        const paymentParams = {
          orderId: orderId,
          orderName: orderName,
          successUrl: successUrl,
          failUrl: failUrl
        };

        if (customerName && customerName.trim()) {
          paymentParams.customerName = customerName;
        }
        if (customerEmail && customerEmail.trim()) {
          paymentParams.customerEmail = customerEmail;
        }
        if (customerPhone && customerPhone.length >= 10) {
          paymentParams.customerMobilePhone = customerPhone;
        }

        console.log('Payment params:', JSON.stringify(paymentParams, null, 2));
        console.log('widgets.requestPayment 호출...');

        await widgets.requestPayment(paymentParams);

        // 이 코드는 실행되지 않음 (성공 시 리다이렉트)
        console.log('requestPayment 완료');

      } catch (error) {
        console.error('Payment error:', error);
        const errorCode = error?.code || 'UNKNOWN_ERROR';
        const errorMessage = error?.message || '결제 처리 중 오류가 발생했습니다.';

        if (errorCode === 'USER_CANCEL' || errorCode === 'PAY_PROCESS_CANCELED') {
          window.parent.postMessage({ type: 'TOSS_PAYMENT_CANCEL' }, '*');
        } else {
          window.parent.postMessage({
            type: 'TOSS_PAYMENT_FAIL',
            code: errorCode,
            message: errorMessage
          }, '*');
        }

        button.disabled = false;
        button.textContent = formatPrice(amount) + '원 결제하기';
      }
    }

    // 파라미터 검증
    if (!orderId || !amount) {
      showError('필수 결제 정보가 누락되었습니다.');
    } else {
      initializePayment();
    }
  </script>
</body>
</html>
